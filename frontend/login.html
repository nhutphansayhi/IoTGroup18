<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Smart Parking Assist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #e5e7eb;
        }

        .login-header {
            margin-bottom: 24px;
        }

        .login-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #b45309;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #f9fafb;
            transition: all 0.2s ease;
            color: #374151;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e40af;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #1e3a5f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-login:hover {
            background-color: #15294a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 58, 95, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .login-footer p {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .login-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Password visibility toggle */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Smart Parking Assist</h1>
            <p>Sign in to your account</p>
        </div>

        <form id="loginForm" action="#" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="you@example.com" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                    >
                </div>
            </div>

            
            <!-- <button type="submit" class="btn-login">Sign In</button> -->
            <p id="loginError" style="color: red; font-size: 0.9rem; margin-top: 10px;"></p> <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="login-footer">
            <p>Don't have an account? <a href="register.html">Create one</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBJjLatTYnevEv9Irljn36pQm7SMz8C_a8",
            authDomain: "smartsupportcardevice.firebaseapp.com",
            databaseURL: "https://smartsupportcardevice-default-rtdb.firebaseio.com",
            projectId: "smartsupportcardevice",
            storageBucket: "smartsupportcardevice.firebasestorage.app",
            messagingSenderId: "349000079236",
            appId: "1:349000079236:web:a0d4e3ea628c90df9c6fd1",
            measurementId: "G-3X6XQCBX60"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // <<< ĐÃ XÓA LOGIC onAuthStateChanged và userLogout khỏi đây >>>

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.querySelector('.btn-login');
            const errorElement = document.getElementById('loginError');
            
            errorElement.textContent = '';
            submitBtn.disabled = true;

            try {
                // SỬ DỤNG HÀM ĐĂNG NHẬP CỦA FIREBASE AUTH
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                
                // Đăng nhập thành công
                console.log('Login successful:', userCredential.user.uid);
                alert('Đăng nhập thành công! Đang chuyển hướng...');
                
                // Chuyển hướng sang trang Dashboard chính
                window.location.href = 'index.html'; 
                
            } catch (error) {
                console.error('Login failed:', error.code, error.message);
                
                // SỬA ĐỔI HIỂN THỊ LỖI CHÍNH XÁC HƠN
                let errorMessage = 'Đăng nhập thất bại: Sai email hoặc mật khẩu.';
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMessage = 'Email hoặc mật khẩu không đúng.';
                }
                errorElement.textContent = errorMessage;

            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
