<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều Khiển IoT ESP32</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; text-align: center; }
        .dashboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; width: 200px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .value { font-size: 2.5rem; font-weight: bold; color: #007bff; margin: 10px 0; }
        .btn { padding: 10px 20px; margin: 5px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; }
        .btn-on { background-color: #28a745; }
        .btn-off { background-color: #dc3545; }
        .status-dot { height: 15px; width: 15px; background-color: #bbb; border-radius: 50%; display: inline-block; }
        .active { background-color: #28a745; }
    </style>
</head>
<body>
    <h1>🎛️ Bảng Điều Khiển IoT</h1>
    <div class = "dashboard">
        <div class = "card">
            <h3>Khoảng cách</h3>
            <div id = "dist" class = "value">--</div>
            <span>cm</span>
        </div>
        <div class="card">
            <h3>Ánh sáng</h3>
            <div id="lux" class="value">--</div>
            <span>ADC (0-4095)</span>
        </div>
        <div class="card">
            <h3>Nút nhấn</h3>
            <div id="btn-status" class="value">--</div>
            <span id="btn-text">Chưa nhấn</span>
        </div>
    </div>

    <hr style="margin: 40px auto; width: 80%;">
    <div class="dashboard">
        <div class="card">
            <h3>💡 Relay</h3>
            <button class="btn btn-on" onclick="sendCommand('RELAY', 'ON')">BẬT</button>
            <button class="btn btn-off" onclick="sendCommand('RELAY', 'OFF')">TẮT</button>
        </div>
        <div class="card">
            <h3>🔊 Buzzer</h3>
            <button class="btn btn-on" onclick="sendCommand('BUZZER', 'ON')">KÊU</button>
            <button class="btn btn-off" onclick="sendCommand('BUZZER', 'OFF')">TẮT</button>
        </div>
    </div>

    <script>
        const socket = io();

        socket.on('sensor-update',(data)=>{
            //Cap nhat so lieu
            document.getElementById('dist').innerText = parseFloat(data.distance).toFixed(1);
            document.getElementById('lux').innerText = data.light;

            // cap nhat trang thai nut nhan
            const btnState = data.btn;
            const btnDot = document.getElementById('btn-status');
            const btnText = document.getElementById('btn-text');

            if(btnState == 1) {
                btnDot.innerHTML = '<span class="status-dot active"></span>';
                btnText.innerText = "Đang Nhấn";
            } else {
                btnDot.innerHTML = '<span class="status-dot"></span>';
                btnText.innerText = "Nhả tay";
            }
        })
        // 2. Gửi lệnh
        function sendCommand(device, status) {
            console.log(`🖱️ Đã gửi lệnh: ${device} -> ${status}`); // Thêm dòng này!
            socket.emit('control-cmd', { device: device, status: status });
        }

        socket.on('button-update', (data) => {
        const btnState = data.btn_status;
        const btnDot = document.getElementById('btn-status');
        const btnText = document.getElementById('btn-text');

        if(btnState == 1) { // 1 = Đang Nhấn (LOW)
            btnDot.innerHTML = '<span class="status-dot active"></span>';
            btnText.innerText = "Đang Nhấn";
        } else { // 0 = Nhả tay (HIGH)
            btnDot.innerHTML = '<span class="status-dot"></span>';
            btnText.innerText = "Nhả tay";
        }
        });
        
    </script>
</body>
</html>
